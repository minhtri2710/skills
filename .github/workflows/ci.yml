name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # test_floor_guard and test_gate_row run scripts under LC_ALL=en_US.ISO8859-1, which the runner lacks.
      - run: sudo apt-get update && sudo apt-get install -y locales && sudo localedef -i en_US -f ISO-8859-1 en_US.ISO8859-1
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests
