# mutmut 3.8.0 names mutants from the path and strips only `src.`, so the scripts are reached through the gitignored `src` symlink (ln -s skills/herdr-delivery-workflow/scripts src) and the three tests prefer it.
# Remove the symlink, this file's src paths and the tests' src preference when mutmut can map a source root to a flat module name.
# Runs use `mutmut run --max-children 2` (shared host resource rule).
[mutmut]
source_paths = src
only_mutate =
    src/gate_row.py
    src/pre_push_guard.py
    src/charter_lint.py
also_copy = skills
pytest_add_cli_args_test_selection =
    tests/test_gate_row.py
    tests/test_pre_push_guard.py
    tests/test_charter_lint.py
pytest_add_cli_args =
    -k
    not test_real_
